name: Update Config Json Schema

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: write
jobs:
  changelog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package
        run: python -m pip install -e .

      - name: Generate Json Schema
        run: python -m paidiverpy.utils.schema_json_handler src/paidiverpy/configuration-schema.json

      - name: Commit and push changes (if any)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add src/paidiverpy/configuration-schema.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore: update json schema"

          git pull --rebase origin dev
          git push origin dev
