name: Release Package (Test PyPI)

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Create conda environment
      run: |
        conda env create -f environment.yml
        echo "conda activate Paidiverpy" >> ~/.bashrc
        source ~/.bashrc
        pip install --upgrade pip
        pip install .
        pip install build twine wheel requests

    - name: Extract Package Version
      run: echo "PACKAGE_VERSION=$(python -c 'import paidiverpy; print(paidiverpy.__version__)')" >> $GITHUB_ENV

    - name: Check if version exists on Test PyPI
      env:
        TEST_PYPI_USERNAME: "__token__"
        TEST_PYPI_PASSWORD: ${{ secrets.TEST_PYPI_PASSWORD }}
      run: |
        PACKAGE_NAME="paidiverpy"  # Replace with your package name
        RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" https://test.pypi.org/pypi/$PACKAGE_NAME/${{ env.PACKAGE_VERSION }}/json)

        if [ "$RESPONSE" -eq 200 ]; then
          echo "Version exists, attempting deletion..."
          curl -X DELETE -u "$TEST_PYPI_USERNAME:$TEST_PYPI_PASSWORD" "https://test.pypi.org/manage/project/$PACKAGE_NAME/release/${{ env.PACKAGE_VERSION }}/"
        else
          echo "Version does not exist, proceeding with upload."
        fi

    - name: Build Package
      run: python -m build

    - name: Publish to Test PyPI
      env:
        TWINE_USERNAME: "__token__"
        TWINE_PASSWORD: ${{ secrets.TEST_PYPI_PASSWORD }}
      run: python -m twine upload --repository-url https://test.pypi.org/legacy/ dist/*

  zenodo:
    needs: release
    runs-on: ubuntu-latest

    steps:
    - name: Simulate Zenodo Archival (Test Mode)
      if: success()
      run: echo "Zenodo archival would be triggered here. (TEST MODE)"
