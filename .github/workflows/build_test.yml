name: Python package

on:
  push:
    branches:
    - main
    - dev
  pull_request:
    branches:
    - main
    - dev

jobs:
  build:
    env:
      PYTHONIOENCODING: utf-8
    if: github.actor != 'github-actions[bot]'
    name: Build for (${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ['ubuntu-latest', 'macos-latest', 'windows-latest']
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: ${{ matrix.python-version }}

      - name: Initialize Conda
        run: |
          conda init bash

      - name: Configure Conda retries
        shell: bash -l {0}
        run: |
          conda config --set remote_read_timeout_secs 60
          conda config --set remote_connect_timeout_secs 60
          conda config --set retry_max 3
          conda config --set retry_sleep 10

      - name: Create conda environment
        shell: bash -l {0}
        run: |
          conda env create -f environment.yml
          conda activate Paidiverpy
          conda run -n Paidiverpy pip install .
          conda run -n Paidiverpy pip install .[test]
          conda run -n Paidiverpy pip install .[dev,publishing]

      - name: Test with pytest
        shell: bash -l {0}
        run: |
          conda run -n Paidiverpy pytest -ra -v -s \
            --cov=src/paidiverpy \
            --cov-config=.coveragerc \
            --cov-report xml:cov.xml \
            --cov-report term-missing \
            --junitxml=junit.xml -o junit_family=legacy

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.10'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./cov.xml
          fail_ci_if_error: true

      - name: Verify that we can build the package
        run:  |
          conda run -n Paidiverpy pip install build twine wheel
          conda run -n Paidiverpy python -m build

      - name: Update conda meta file
        # only runs in linux and python 3.10
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: |
          sha256=$(sha256sum dist/*.tar.gz | cut -d ' ' -f 1)
          sed -i "1s/^/{% set sha256 = \"$sha256\" %}\n/" conda_recipes/meta.yaml
          sed -i "1s/^/{% set sha256 = \"$sha256\" %}\n/" conda_recipes/meta_bioconda.yaml


      - name: Commit and Push Changes
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Figure out which branch to push to
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BRANCH="${{ github.head_ref }}"
          else
            BRANCH="${{ github.ref_name }}"
          fi

          # Make sure we’re on the correct branch (not detached HEAD)
          git fetch origin $BRANCH
          git checkout $BRANCH

          git add conda_recipes/meta_bioconda.yaml conda_recipes/meta.yaml
          git commit -m "chore: update conda recipe" || true

          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:$BRANCH
