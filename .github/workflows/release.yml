name: Build and Upload to PyPI

on:
  push:
    branches:
      - main
  release:
    types: [published]

jobs:
  release:
    env:
      PYTHONIOENCODING: utf-8
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash -l {0}

    permissions:
      contents: write
      packages: write

    steps:
    - uses: actions/checkout@v4

    - name: Set up Miniconda
      uses: conda-incubator/setup-miniconda@v3
      with:
        environment-file: environment.yml
        activate-environment: Paidiverpy
        python-version: '3.12'
        auto-activate-base: false
        conda-solver: libmamba

    - name: Configure Conda retries
      run: |
        conda config --set remote_read_timeout_secs 60
        conda config --set remote_connect_timeout_secs 60
        conda config --set remote_max_retries 3

    - name: Install package
      run: |
        conda activate Paidiverpy
        python -m pip install --upgrade pip
        python -m pip install -e .
        python -m pip install build twine wheel

    - name: Build Package
      run: |
        conda activate Paidiverpy
        python -m build

    - name: Publish to Test PyPI
      env:
        TWINE_USERNAME: "__token__"
        TWINE_PASSWORD: ${{ secrets.TEST_PYPI_PASSWORD }}
      run: |
        conda activate Paidiverpy
        python -m twine upload --repository-url https://test.pypi.org/legacy/ dist/*


    - name: Publish to PyPI
      env:
        TWINE_USERNAME: "__token__"
        TWINE_PASSWORD: ${{ secrets.PYPI_PASSWORD }}
      run: |
        conda activate Paidiverpy
        python -m twine upload dist/* --verbose

  zenodo:
    needs: release
    runs-on: ubuntu-latest

    steps:
    - name: Trigger Zenodo Archival
      if: success()
      run: echo "Zenodo archival handled automatically by GitHub release."

  conda:
    needs: release
    runs-on: ubuntu-latest

    steps:
    - name: Set up Miniconda
      uses: conda-incubator/setup-miniconda@v3
      with:
        python-version: 3.10
