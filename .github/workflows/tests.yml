name: Run tests

on: pull_request

jobs:
  run-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10"]

    steps:
      - uses: actions/checkout@v4
      - name: Energy Estimation - Initialize
        if: ${{matrix.os == 'ubuntu-latest'}}
        uses: green-coding-solutions/eco-ci-energy-estimation@v4
        with:
          task: start-measurement
          project: ${{ secrets.CARBONDB_PROJECT_UUID }}
          tags: "${{github.workflow}},core-pinned,OS-${{matrix.os}},Company-${{ secrets.CARBONDB_COMPANY_UUID }},Py-${{matrix.python-version}}"
          electricitymaps-api-token: ${{ secrets.ELECTRICITY_MAPS_TOKEN }}
          send-data: true

      - name: Set up Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: ${{ matrix.python-version }}

      - name: Initialize Conda
        run: |
          conda init bash

      - name: Create conda environment
        run: |
          conda env create -f environment.yml
          source ~/.bashrc
          conda activate Paidiverpy
          pip install .
          pip install ".[test]"

      - name: Test with pytest
        run: |
          conda run -n Paidiverpy pytest tests/
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: true
