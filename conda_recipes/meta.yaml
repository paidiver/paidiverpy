{% set sha256 = "71d52708aa5f6e9e295bfdcadcc3b1387d446ada5fa9209325f52dd64d3429fa" %}
{% set sha256 = "980300c1d557056a65ff4a4faf0ef74af2bc083375dc4cd69b4d56ccce6014a6" %}
{% set sha256 = "135edbe87de362558416417168f09bb04b66cf7ed3bbf6efc10ca51996ebcb84" %}
{% set sha256 = "2535764c1bee0da3f3ad06ae3a7f5bad675934a399da37d6617dc697347fa0d8" %}
{% set sha256 = "1b82e697aefb9266bceb0ecd9984bc619bbcd50096e7e870cd0632b08711b8a6" %}
{% set sha256 = "a2299b97452b6588595121b03e0253fa41d455d97940a8dd9cc49c0b85ec5776" %}
{% set sha256 = "00f8333cd7474c8285718c87344edf88b96b43ecc1f8bfc5fe0104483639c6ba" %}
{% set sha256 = "ee90f3acc1ce91a310b907dcbc6c6e1977124846ed5c20e8def07e413dbc9a31" %}
{% set python_min = "3.10" %}
{% set version = "0.1.3" %}
{% set name = "paidiverpy" %}
package:
  name: {{ name|lower }}
  version: {{ version }}
source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:
  entry_points:
    - paidiverpy = cli.main:main
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools >=64.0.0
    - setuptools-scm
    - wheel
    - pip
  run:
    - python >={{ python_min }}
    - numpy <2.0
    - pandas >=2.2.2
    - pillow >=10.4.0
    - scikit-image >=0.24.0
    - scipy >=1.14
    - tqdm >=4.66.4
    - PyYAML >=6.0
    - openpyxl >=3.1
    - shapely ==2.0.7
    - geopy >=2.4.1
    - geopandas >=1.0.1
    - dask-image ==2024.5.3
    - dask >=2024.10.0
    - distributed >=2024.10.0
    - jsonschema >=4.23.0
    - matplotlib-base >=3.5.0
    - ipython >=8.26.0
    - dask-jobqueue >=0.9.0
    - python-dotenv >=1.0.1
    - boto3 >=1.35.92
    - botocore >=1.35.92
    - opencv >=4.11

test:
  imports:
    - cli
    - paidiverpy
  commands:
    - pip check
    - paidiverpy --help
  requires:
    - python {{ python_min }}
    - pip

about:
  summary: A library to preprocess image data.
  home: https://github.com/paidiver/paidiverpy
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - soutobias
